name: NEXORA Backend CI

on:
  push:
    branches:
      - main
      - feature/multimodal-rag
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: |
          # Dataset-dependent migration tests run separately with private fixtures.
          python -m pytest tests/ -q --ignore=tests/test_reindex_webshoppers_vision.py
